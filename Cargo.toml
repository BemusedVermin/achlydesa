[workspace]
resolver = "3"
members = ["agent_core", "agents", "combat_cli", "combat_core", "config", "explore", "game_sim", "party", "rpg", "sim", "survival", "tools/coupling-lint", "travel"]

[workspace.dependencies]
hexx = "0.24"

# Keep our code quick to compile while third-party dependencies are built fully optimized —
# we don't step into them, so they carry no debuginfo and are compiled once and cached.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false
