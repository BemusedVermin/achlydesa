[workspace]
resolver = "3"
members = ["app", "agent_core", "agents", "combat_cli", "combat_core", "config", "explore", "game_sim", "party", "rpg", "sim", "survival", "tools/coupling-lint", "travel", "voice"]

[workspace.dependencies]
hexx = "0.24"

# Keep our code quick to compile while the (large) Bevy dependency stack is built
# fully optimized — we don't step into the engine, so it carries no debuginfo.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false
