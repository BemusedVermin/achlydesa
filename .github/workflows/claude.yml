name: Claude Code

# Interactive assistant: mention `@claude` in an issue, a PR comment, a PR review, or a
# review comment and Claude responds in that thread (answer a question, draft a fix,
# explain CI, etc.). Unlike claude-code-review.yml this is on-demand, not per-PR.
#
# ## Setup required
#
# Needs a `CLAUDE_CODE_OAUTH_TOKEN` repository secret (create with `claude setup-token`
# or the `/install-github-app` flow, then add it under Settings -> Secrets and variables
# -> Actions). Until it exists, triggered runs fail at the "Run Claude Code" step.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Lets Claude read CI results on PRs.
          additional_permissions: |
            actions: read

          # Optional: a custom prompt. If omitted, Claude follows the instructions in the
          # comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: customise behaviour / tool access. See
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # claude_args: '--allowed-tools Bash(gh pr *)'
