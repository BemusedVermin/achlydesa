[package]
name = "combat_cli"
version = "0.1.0"
edition = "2024"
description = "Headless driver for combat_core: load a scenario, run it, print the event trace as JSON."

[[bin]]
name = "combat_cli"
path = "src/main.rs"

[dependencies]
combat_core = { path = "../combat_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
